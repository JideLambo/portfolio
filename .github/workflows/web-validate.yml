name: Web Validate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-checks-reusable.yml'
      - '.github/workflows/web-validate.yml'
      - 'code/app/shared/**'
      - 'code/app/web/**'
      - 'knip.json'
      - 'package-lock.json'
      - 'package.json'
      - 'vercel.json'
      - 'vite.shared.js'
      - 'vitest.config.js'

jobs:
  validate-web:
    uses: ./.github/workflows/web-checks-reusable.yml
    with:
      upload_test_report: true

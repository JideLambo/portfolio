name: Web Main Checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-checks-reusable.yml'
      - '.github/workflows/web-main.yml'
      - 'code/app/shared/**'
      - 'code/app/web/**'
      - 'knip.json'
      - 'package-lock.json'
      - 'package.json'
      - 'vercel.json'
      - 'vite.shared.js'
      - 'vitest.config.js'

# Quality gate on main. Production deploys via Vercel (Git integration).
jobs:
  validate-web:
    uses: ./.github/workflows/web-checks-reusable.yml
    with:
      upload_test_report: true
